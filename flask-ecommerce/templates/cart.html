<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shopping-bag"></i> ShopHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/cart">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span id="cart-count" class="badge bg-danger">0</span>
                        </a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="fw-bold"><i class="fas fa-shopping-cart me-3"></i>Shopping Cart</h1>
            <p class="lead mb-0">Review your selected items</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="cart-card">
                        <h4><i class="fas fa-shopping-cart me-2"></i>Cart Items</h4>
                        <div id="cart-items-container">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary"></div>
                                <p class="mt-2 text-muted">Loading...</p>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-3 flex-wrap gap-2">
                            <a href="/products" class="btn btn-outline-primary">
                                <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                            </a>
                            <button class="btn btn-outline-danger" onclick="clearCart()">
                                <i class="fas fa-trash me-2"></i>Clear Cart
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="summary-card">
                        <h4><i class="fas fa-receipt me-2"></i>Order Summary</h4>
                        <div class="summary-row">
                            <span>Subtotal</span><span id="subtotal">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%)</span><span id="tax">$0.00</span>
                        </div>
                        <div class="summary-row">
                            <strong>Total</strong><strong id="total">$0.00</strong>
                        </div>
                        <div class="mt-4">
                            <a href="/checkout" id="checkout-btn" class="btn btn-primary w-100 btn-lg" style="display:none;">
                                <i class="fas fa-credit-card me-2"></i>Proceed to Checkout
                            </a>
                        </div>
                        <div class="mt-3 text-center">
                            <small class="text-muted"><i class="fas fa-lock me-1"></i>Secure Checkout</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container text-center py-3">
            <p class="mb-0 text-muted">&copy; 2024 ShopHub.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>

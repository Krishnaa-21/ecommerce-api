<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub — Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/"><span style="color:var(--accent)">Shop</span>Hub</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <i class="fas fa-bars" style="color:var(--white)"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item">
                    <a class="nav-link active" href="/cart">
                        <i class="fas fa-shopping-bag me-1"></i>Cart
                        <span id="cart-count" class="badge">0</span>
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container position-relative" style="z-index:1">
        <h1><i class="fas fa-shopping-bag me-3" style="color:var(--accent)"></i>Your Cart</h1>
        <p class="lead">Review items before checkout</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="cart-card">
                    <h4><i class="fas fa-bag-shopping me-2" style="color:var(--accent)"></i>Cart Items</h4>
                    <div id="cart-items-container">
                        <div class="text-center py-5">
                            <div class="spinner-border"></div>
                            <p class="mt-2" style="color:var(--muted)">Loading cart...</p>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4 pt-3 flex-wrap gap-2" style="border-top:1px solid var(--border)">
                        <a href="/products" class="btn btn-outline-primary">
                            <i class="fas fa-arrow-left me-2"></i>Continue Shopping
                        </a>
                        <button class="btn btn-outline-danger" onclick="clearCart()">
                            <i class="fas fa-trash me-2"></i>Clear Cart
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-card">
                    <h4><i class="fas fa-receipt me-2" style="color:var(--accent)"></i>Summary</h4>
                    <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0.00</span></div>
                    <div class="summary-row"><span>GST (18%)</span><span id="tax">₹0.00</span></div>
                    <div class="summary-row"><span>Total</span><span id="total">₹0.00</span></div>
                    <div class="mt-4">
                        <a href="/checkout" id="checkout-btn" class="btn btn-primary w-100 btn-lg" style="display:none;">
                            <i class="fas fa-credit-card me-2"></i>Checkout
                        </a>
                    </div>
                    <div class="text-center mt-3">
                        <small style="color:var(--muted)"><i class="fas fa-lock me-1" style="color:var(--success)"></i>Secure SSL Checkout</small>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mt-3" style="font-size:1.5rem;color:var(--muted)">
                        <i class="fab fa-cc-visa"></i>
                        <i class="fab fa-cc-mastercard"></i>
                        <i class="fab fa-google-pay"></i>
                        <i class="fab fa-amazon-pay"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container text-center py-2">
        <p class="mb-0" style="font-size:.85rem">&copy; 2024 ShopHub.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>

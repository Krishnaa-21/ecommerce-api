<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub — My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/"><span style="color:var(--accent)">Shop</span>Hub</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <i class="fas fa-bars" style="color:var(--white)"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto gap-1">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart">
                        <i class="fas fa-shopping-bag me-1"></i>Cart
                        <span id="cart-count" class="badge">0</span>
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link active" href="/orders">Orders</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="page-header">
    <div class="container position-relative" style="z-index:1">
        <h1><i class="fas fa-box me-3" style="color:var(--accent)"></i>My Orders</h1>
        <p class="lead">Track and manage all your purchases</p>
    </div>
</section>

<section class="py-5" style="min-height:60vh">
    <div class="container">
        <div id="orders-container">
            <div class="text-center py-5">
                <div class="spinner-border" style="width:3rem;height:3rem;"></div>
                <p class="mt-3" style="color:var(--muted)">Loading orders...</p>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container text-center py-2">
        <p class="mb-0" style="font-size:.85rem">&copy; 2024 ShopHub. Made with <i class="fas fa-heart" style="color:var(--accent)"></i> in India</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
